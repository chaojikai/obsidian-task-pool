# Builds the plugin and publishes main.js, manifest.json and styles.css to the GitHub release for a tag.
# Runs on a tag push whose name matches the manifest.json version (for example 0.1.0), or by hand from the Actions tab.
# A missing release is created and published straight away; an existing one gets its assets replaced.
name: Release Obsidian plugin

on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and upload assets for"
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Resolve tag and check it matches manifest version
        id: tag
        run: |
          tag="${{ github.event.inputs.tag }}"
          if [ -z "$tag" ]; then tag="${GITHUB_REF#refs/tags/}"; fi
          version="$(node -p "require('./manifest.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "Tag $tag does not match manifest.json version $version" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Build plugin
        env:
          TASK_POOL_OUT: dist
        run: |
          npm ci --legacy-peer-deps
          npm run build

      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/main.js
            dist/manifest.json
            dist/styles.css

      - name: Extract release notes for this version
        id: notes
        run: |
          tag="${{ steps.tag.outputs.tag }}"
          # The CHANGELOG section for this version, without its own heading
          awk -v tag="$tag" '
            $0 ~ "^## " tag " " || $0 == "## " tag { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "Release $tag" > notes.md; fi
          cat notes.md

      - name: Publish release with assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="${{ steps.tag.outputs.tag }}"
          # Publish directly rather than as a draft: publishing a draft from the
          # web UI drops assets uploaded by this workflow.
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/main.js dist/manifest.json dist/styles.css --clobber
          else
            gh release create "$tag" --title="$tag" --notes-file notes.md dist/main.js dist/manifest.json dist/styles.css
          fi
